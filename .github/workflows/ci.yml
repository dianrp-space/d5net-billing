name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test -race ./...
      - name: Build linux amd64/arm64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/drp-api-linux-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/drp-worker-linux-amd64 ./cmd/worker
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/drp-api-linux-arm64 ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/drp-worker-linux-arm64 ./cmd/worker
          sha256sum dist/* > dist/SHA256SUMS

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx vitest run --pool=forks
      - run: npm run build
