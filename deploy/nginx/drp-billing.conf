server {
    listen 80;
    server_name billing.dianrp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name billing.dianrp.com;

    # SSL managed by aaPanel Let's Encrypt
    ssl_certificate     /www/server/panel/vhost/cert/billing.dianrp.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/billing.dianrp.com/privkey.pem;

    # Hasil `npm run build` — jangan arahkan root ke folder git repo
    root /www/wwwroot/billing.dianrp.com/web/dist;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location ^~ /.git {
        deny all;
        return 404;
    }

    # Frontend SPA (history fallback untuk /<slug>/...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Branding uploads (logo/favicon) served by API from UPLOAD_DIR
    location /uploads/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE events (monitoring realtime)
    location /events/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    access_log /www/wwwlogs/billing.dianrp.com.access.log;
    error_log  /www/wwwlogs/billing.dianrp.com.error.log;
}
