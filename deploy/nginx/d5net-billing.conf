# Isolir captive (DST-NAT): klien isolir membuka http://situs-apapun → RouterOS
# membelokkan ke IP publik:80 dengan Host sembarang. Blok default_server ini
# menangkap Host yang BUKAN domain billing dan menyajikan halaman isolir.
#
# Domain billing tetap di server_name di bawah (redirect ke HTTPS).
# Go captive listener: ISOLIR_HTTP_ADDR=127.0.0.1:8090
# Settings → Port captive isolir (DST-NAT) = 80
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    access_log /www/wwwlogs/isolir-captive.access.log;
    error_log  /www/wwwlogs/isolir-captive.error.log;
}

server {
    listen 80;
    server_name delimanet.dianrp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name delimanet.dianrp.com;

    # SSL managed by aaPanel Let's Encrypt
    ssl_certificate     /www/server/panel/vhost/cert/delimanet.dianrp.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/delimanet.dianrp.com/privkey.pem;

    # Hasil `npm run build` — jangan arahkan root ke folder git repo
    root /www/wwwroot/delimanet.dianrp.com/web/dist;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location ^~ /.git {
        deny all;
        return 404;
    }

    # Frontend SPA (history fallback untuk /admin/*, /client/*, /login, /isolir)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Shell SPA jangan di-cache: setelah deploy browser selalu ambil
    # index.html baru yang menunjuk chunk hash baru (mencegah chunk basi).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Chunk JS/CSS Vite bernama hash → immutable, aman di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Branding uploads (logo/favicon) served by API from UPLOAD_DIR
    location /uploads/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE events (monitoring realtime)
    location /events/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    access_log /www/wwwlogs/delimanet.dianrp.com.access.log;
    error_log  /www/wwwlogs/delimanet.dianrp.com.error.log;
}
