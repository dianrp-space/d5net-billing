server {
    listen 80;
    server_name delimanet.dianrp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name delimanet.dianrp.com;

    # SSL managed by aaPanel Let's Encrypt
    ssl_certificate     /www/server/panel/vhost/cert/delimanet.dianrp.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/delimanet.dianrp.com/privkey.pem;

    # Hasil `npm run build` — jangan arahkan root ke folder git repo
    root /www/wwwroot/delimanet.dianrp.com/web/dist;
    index index.html;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # P0-6 audit 2026-09-22. HSTS hanya di sini (lapis TLS); Go tidak set HSTS.
    # Catatan Nginx: location yang punya add_header sendiri TIDAK mewarisi
    # header server — makanya header diulang di /index.html dan /assets/.
    # CSP sengaja tidak dipasang untuk SPA (risiko inline script Vite).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /.git {
        deny all;
        return 404;
    }

    # Frontend SPA (history fallback untuk /admin/*, /client/*, /login, /isolir)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Shell SPA jangan di-cache: setelah deploy browser selalu ambil
    # index.html baru yang menunjuk chunk hash baru (mencegah chunk basi).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Chunk JS/CSS Vite bernama hash → immutable, aman di-cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Branding uploads (logo/favicon) served by API from UPLOAD_DIR
    location /uploads/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE events (monitoring realtime)
    location /events/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    access_log /www/wwwlogs/delimanet.dianrp.com.access.log;
    error_log  /www/wwwlogs/delimanet.dianrp.com.error.log;
}
